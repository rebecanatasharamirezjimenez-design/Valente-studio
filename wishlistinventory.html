<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valente Studio · Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --cream: #FAF7F2;
    --warm-white: #FFF9F4;
    --sand: #E8DDD0;
    --taupe: #C4B5A5;
    --mocha: #8B7355;
    --espresso: #4A3728;
    --rose-dust: #D4A5A5;
    --sage: #9CAF88;
    --gold: #C8A96E;
    --gold-light: #E8D5A3;
    --text-dark: #2C1810;
    --text-mid: #6B5344;
    --text-light: #A08070;
    --card-bg: #FFFCF8;
    --shadow: 0 4px 24px rgba(74,55,40,0.08);
    --shadow-hover: 0 12px 48px rgba(74,55,40,0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 10%, rgba(200,169,110,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 80%, rgba(212,165,165,0.1) 0%, transparent 60%);
  }

  /* HEADER */
  header {
    background: var(--espresso);
    padding: 32px 40px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(200,169,110,0.15);
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 20%;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(212,165,165,0.08);
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    position: relative;
    z-index: 1;
  }
  .header-title h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    color: var(--gold-light);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .header-title .subtitle {
    color: var(--taupe);
    font-size: 0.9rem;
    font-weight: 300;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }
  .header-title .tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.82rem;
    color: var(--gold);
    margin-top: 3px;
    letter-spacing: 0.06em;
    opacity: 0.8;
  }
  .header-stats {
    display: flex;
    gap: 24px;
  }
  .stat-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 100px;
    padding: 10px 20px;
    text-align: center;
  }
  .stat-pill .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    display: block;
    line-height: 1;
  }
  .stat-pill .lbl {
    font-size: 0.72rem;
    color: var(--taupe);
    font-weight: 300;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .add-btn-wrap {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-bottom: 28px;
  }
  .btn-export {
    background: transparent;
    color: var(--mocha);
    border: 1.5px solid var(--mocha);
    border-radius: 100px;
    padding: 14px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .btn-export:hover {
    background: var(--mocha);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(139,115,85,0.25);
  }
  .btn-export svg { width: 17px; height: 17px; }
  /* autosave indicator */
  .autosave-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--text-light);
    margin-bottom: 16px;
    justify-content: flex-end;
  }
  .autosave-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sage);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .btn-add {
    background: var(--espresso);
    color: var(--gold-light);
    border: none;
    border-radius: 100px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 16px rgba(74,55,40,0.25);
  }
  .btn-add:hover {
    background: var(--mocha);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(74,55,40,0.3);
  }
  .btn-add svg { width: 18px; height: 18px; }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-size: 0.8rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .filter-btn {
    background: transparent;
    border: 1.5px solid var(--sand);
    border-radius: 100px;
    padding: 7px 16px;
    font-size: 0.82rem;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--espresso);
    border-color: var(--espresso);
    color: var(--gold-light);
  }
  .search-wrap {
    margin-left: auto;
    position: relative;
  }
  .search-wrap input {
    background: white;
    border: 1.5px solid var(--sand);
    border-radius: 100px;
    padding: 8px 16px 8px 36px;
    font-size: 0.85rem;
    color: var(--text-dark);
    font-family: 'DM Sans', sans-serif;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--mocha); }
  .search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--taupe);
    width: 16px; height: 16px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    border: 1px solid rgba(200,169,110,0.1);
    animation: cardIn 0.4s ease both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
  }

  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: var(--sand);
  }
  .card-img-placeholder {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, var(--sand) 0%, var(--taupe) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--mocha);
  }
  .card-img-placeholder svg { width: 48px; height: 48px; opacity: 0.5; }

  .card-body {
    padding: 18px 20px 20px;
  }
  .card-category {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--espresso);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .card-code {
    font-size: 0.78rem;
    color: var(--text-light);
    background: var(--cream);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 12px;
    font-family: monospace;
    letter-spacing: 0.05em;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--sand);
  }
  .card-price {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--espresso);
  }
  .card-price span {
    font-size: 0.8rem;
    color: var(--text-light);
    font-family: 'DM Sans', sans-serif;
    font-style: italic;
  }
  .card-qty-badge {
    background: var(--espresso);
    color: var(--gold-light);
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 0.82rem;
    font-weight: 500;
  }
  .card-total {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 6px;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--mocha);
    font-size: 0.8rem;
    text-decoration: none;
    margin-top: 8px;
    transition: color 0.2s;
  }
  .card-link:hover { color: var(--espresso); }
  .card-link svg { width: 13px; height: 13px; }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .btn-icon {
    border: 1.5px solid var(--sand);
    background: transparent;
    border-radius: 10px;
    padding: 7px 10px;
    cursor: pointer;
    color: var(--text-mid);
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-icon:hover { border-color: var(--mocha); color: var(--espresso); }
  .btn-icon.danger:hover { border-color: #C0392B; color: #C0392B; }
  .btn-icon svg { width: 14px; height: 14px; }
  .btn-mark {
    flex: 1;
    background: var(--sage);
    border-color: var(--sage);
    color: white;
    justify-content: center;
  }
  .btn-mark:hover { background: #7A9A68; border-color: #7A9A68; color: white; }
  .card.purchased { opacity: 0.55; }
  .card.purchased .card-name { text-decoration: line-through; }
  .purchased-badge {
    background: var(--sage);
    color: white;
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 100px;
    display: inline-block;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    grid-column: 1/-1;
  }
  .empty-state svg { width: 80px; height: 80px; color: var(--taupe); margin-bottom: 20px; }
  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    color: var(--mocha);
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  .empty-state p { color: var(--text-light); font-size: 0.9rem; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(44,24,16,0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--warm-white);
    border-radius: 24px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 32px 80px rgba(44,24,16,0.3);
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    padding: 28px 32px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    font-family: 'Playfair Display', serif;
    color: var(--espresso);
    font-size: 1.4rem;
  }
  .btn-close {
    background: var(--sand);
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--mocha);
    transition: all 0.2s;
  }
  .btn-close:hover { background: var(--taupe); color: white; }
  .modal-body { padding: 24px 32px 32px; }

  /* FORM */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 7px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: white;
    border: 1.5px solid var(--sand);
    border-radius: 12px;
    padding: 11px 15px;
    font-size: 0.92rem;
    color: var(--text-dark);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--mocha); }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* IMAGE UPLOAD */
  .img-upload-area {
    border: 2px dashed var(--taupe);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--cream);
    position: relative;
  }
  .img-upload-area:hover { border-color: var(--mocha); background: var(--warm-white); }
  .img-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .img-upload-area svg { width: 36px; height: 36px; color: var(--taupe); margin-bottom: 10px; }
  .img-upload-area p { color: var(--text-light); font-size: 0.85rem; }
  .img-upload-area strong { color: var(--mocha); }
  .img-preview {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 12px;
    display: none;
    margin-top: 10px;
  }

  .modal-footer {
    padding: 0 32px 28px;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .btn-cancel {
    background: transparent;
    border: 1.5px solid var(--sand);
    border-radius: 100px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--taupe); color: var(--espresso); }
  .btn-save {
    background: var(--espresso);
    border: none;
    border-radius: 100px;
    padding: 12px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--gold-light);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .btn-save:hover { background: var(--mocha); transform: translateY(-1px); }

  /* SUMMARY BAR */
  .summary-bar {
    background: var(--espresso);
    border-radius: 16px;
    padding: 18px 24px;
    margin-bottom: 28px;
    display: flex;
    gap: 0;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }
  .summary-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--taupe);
    font-size: 0.85rem;
  }
  .summary-item .val {
    font-family: 'Playfair Display', serif;
    color: var(--gold-light);
    font-size: 1.1rem;
  }
  .summary-item::after {
    content: '';
    width: 1px; height: 30px;
    background: rgba(200,169,110,0.2);
    margin-left: 20px;
  }
  .summary-item:last-child::after { display: none; }

  .notes-toggle {
    font-size: 0.8rem;
    color: var(--text-light);
    cursor: pointer;
    text-decoration: underline;
    margin-top: 4px;
    display: inline-block;
  }
  .card-notes {
    font-size: 0.82rem;
    color: var(--text-light);
    font-style: italic;
    margin-top: 6px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>💝 Valente Studio</h1>
      <div class="subtitle">Inventario de productos por comprar</div>
      <div class="tagline">Curated with love · Lista de deseos</div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="num" id="stat-total">0</span>
        <span class="lbl">Productos</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-amount">₡0</span>
        <span class="lbl">Total estimado</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-pending">0</span>
        <span class="lbl">Por comprar</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="autosave-bar">
    <div class="autosave-dot"></div>
    <span id="autosave-label">Guardado automático activo</span>
  </div>
  <div class="add-btn-wrap">
    <button class="btn-export" onclick="exportToExcel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      Exportar a Excel
    </button>
    <button class="btn-add" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar producto
    </button>
  </div>

  <div class="filters">
    <span class="filter-label">Filtrar:</span>
    <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Por comprar</button>
    <button class="filter-btn" onclick="setFilter('purchased', this)">Comprados</button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Buscar producto..." oninput="searchProducts(this.value)" id="search-input">
    </div>
  </div>

  <div id="grid" class="grid"></div>
</main>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nuevo producto</h2>
      <button class="btn-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Imagen del producto</label>
        <div class="img-upload-area" id="upload-area">
          <input type="file" accept="image/*" id="img-input" onchange="handleImage(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p><strong>Haz clic o arrastra</strong> una captura de pantalla</p>
          <p style="font-size:0.75rem;margin-top:4px;">JPG, PNG, WEBP</p>
          <img class="img-preview" id="img-preview" alt="Vista previa">
        </div>
      </div>

      <div class="form-group">
        <label>Nombre del producto *</label>
        <input type="text" id="f-name" placeholder="Ej: Silla ergonómica OfficePro">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="f-category">
          <option value="">Sin categoría</option>
          <option value="Baby Dreams">👶 Baby Dreams</option>
          <option value="Little Princess">🎀 Little Princess</option>
          <option value="Matcha Era">🍵 Matcha Era</option>
          <option value="Glow & Grow">✨ Glow & Grow</option>
          <option value="Wealth Era">💰 Wealth Era</option>
          <option value="Mom Life">🧑‍💼 Mom Life</option>
          <option value="Wellness">🌿 Wellness</option>
          <option value="Wedding">💍 Wedding</option>
          <option value="Corporate">🏢 Corporate</option>
        </select>
      </div>

      <div class="form-group">
        <label>Código / SKU</label>
        <input type="text" id="f-code" placeholder="Ej: SKU-12345">
      </div>

      <div class="form-group">
        <label>Enlace / URL</label>
        <input type="url" id="f-link" placeholder="https://...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Precio unitario</label>
          <input type="number" id="f-price" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" id="f-qty" placeholder="1" min="1" value="1">
        </div>
      </div>

      <div class="form-group">
        <label>Notas / Descripción</label>
        <textarea id="f-notes" placeholder="Razón de compra, color, talla, etc."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveProduct()">Guardar producto</button>
    </div>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('valente_studio_products') || '[]');
let editingId = null;
let currentFilter = 'all';
let searchQuery = '';
let currentImageData = null;

function save() {
  localStorage.setItem('valente_studio_products', JSON.stringify(products));
  // Show autosave feedback
  const lbl = document.getElementById('autosave-label');
  if (lbl) {
    const now = new Date();
    lbl.textContent = `Guardado a las ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    setTimeout(() => { lbl.textContent = 'Guardado automático activo'; }, 3000);
  }
}

function exportToExcel() {
  if (products.length === 0) { alert('No hay productos para exportar.'); return; }

  // Build data rows
  const rows = products.map(p => ({
    'Nombre': p.name || '',
    'Categoría': p.category || '',
    'Código / SKU': p.code || '',
    'Enlace': p.link || '',
    'Precio Unitario (₡)': p.price || 0,
    'Cantidad': p.qty || 1,
    'Total (₡)': (p.price || 0) * (p.qty || 1),
    'Notas': p.notes || '',
    'Estado': p.purchased ? 'Comprado' : 'Por comprar',
    'Fecha agregado': p.createdAt ? new Date(p.createdAt).toLocaleDateString('es-CR') : ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    {wch:30},{wch:18},{wch:16},{wch:40},
    {wch:18},{wch:10},{wch:16},{wch:35},{wch:14},{wch:16}
  ];

  // Style header row (bold)
  const headers = Object.keys(rows[0]);
  headers.forEach((h, i) => {
    const cell = XLSX.utils.encode_cell({r:0, c:i});
    if (!ws[cell]) return;
    ws[cell].s = { font: { bold: true }, fill: { fgColor: { rgb: "4A3728" } }, alignment: { horizontal: 'center' } };
  });

  // Summary sheet
  const totalVal = products.reduce((a,p) => a + (p.price||0)*(p.qty||1), 0);
  const pendientes = products.filter(p => !p.purchased);
  const comprados = products.filter(p => p.purchased);
  const summaryData = [
    ['Valente Studio · Resumen de Inventario', ''],
    ['Fecha de exportación', new Date().toLocaleDateString('es-CR')],
    ['', ''],
    ['Total de productos', products.length],
    ['Por comprar', pendientes.length],
    ['Comprados', comprados.length],
    ['Monto total estimado (₡)', totalVal],
    ['Monto pendiente (₡)', pendientes.reduce((a,p) => a+(p.price||0)*(p.qty||1),0)],
    ['Monto comprado (₡)', comprados.reduce((a,p) => a+(p.price||0)*(p.qty||1),0)],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(summaryData);
  ws2['!cols'] = [{wch:32},{wch:24}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');

  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Valente_Studio_Inventario_${fecha}.xlsx`);
}

function formatCurrency(val) {
  if (!val && val !== 0) return '—';
  return new Intl.NumberFormat('es-CR', { style: 'currency', currency: 'CRC', minimumFractionDigits: 0 }).format(val);
}

function updateStats() {
  const pending = products.filter(p => !p.purchased);
  const totalAmount = products.reduce((a, p) => a + (p.price * p.qty || 0), 0);
  document.getElementById('stat-total').textContent = products.length;
  document.getElementById('stat-amount').textContent = formatCurrency(totalAmount);
  document.getElementById('stat-pending').textContent = pending.length;
}

function filteredProducts() {
  let list = [...products];
  if (currentFilter === 'pending') list = list.filter(p => !p.purchased);
  if (currentFilter === 'purchased') list = list.filter(p => p.purchased);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(q) ||
      (p.code||'').toLowerCase().includes(q) ||
      (p.category||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function render() {
  const grid = document.getElementById('grid');
  const list = filteredProducts();
  updateStats();

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <h3>Tu lista está vacía</h3>
        <p>Agrega productos que quieres comprar</p>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const total = (p.price && p.qty) ? p.price * p.qty : null;
    const imgEl = p.image
      ? `<img class="card-img" src="${p.image}" alt="${p.name}">`
      : `<div class="card-img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`;
    return `
    <div class="card ${p.purchased ? 'purchased' : ''}" id="card-${p.id}">
      ${imgEl}
      <div class="card-body">
        ${p.purchased ? '<span class="purchased-badge">✓ Comprado</span>' : ''}
        ${p.category ? `<div class="card-category">${p.category}</div>` : ''}
        <div class="card-name">${p.name}</div>
        ${p.code ? `<div class="card-code">#${p.code}</div>` : ''}
        ${p.link ? `<a class="card-link" href="${p.link}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          Ver producto
        </a>` : ''}
        ${p.notes ? `<div class="card-notes">${p.notes}</div>` : ''}
        <div class="card-meta">
          <div>
            <div class="card-price">${p.price ? formatCurrency(p.price) : '—'} <span>c/u</span></div>
            ${total ? `<div class="card-total">Total: ${formatCurrency(total)}</div>` : ''}
          </div>
          <div class="card-qty-badge">×${p.qty || 1}</div>
        </div>
        <div class="card-actions">
          ${!p.purchased ? `<button class="btn-icon btn-mark" onclick="markPurchased('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>
            Marcar comprado
          </button>` : `<button class="btn-icon btn-mark" onclick="markPurchased('${p.id}')" style="background:#C4B5A5;border-color:#C4B5A5;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Desmarcar
          </button>`}
          <button class="btn-icon" onclick="editProduct('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon danger" onclick="deleteProduct('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(id = null) {
  editingId = id;
  currentImageData = null;
  const overlay = document.getElementById('modal-overlay');
  overlay.style.display = 'flex';

  if (id) {
    const p = products.find(x => x.id === id);
    document.getElementById('modal-title').textContent = 'Editar producto';
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-category').value = p.category || '';
    document.getElementById('f-code').value = p.code || '';
    document.getElementById('f-link').value = p.link || '';
    document.getElementById('f-price').value = p.price || '';
    document.getElementById('f-qty').value = p.qty || 1;
    document.getElementById('f-notes').value = p.notes || '';
    if (p.image) {
      currentImageData = p.image;
      const prev = document.getElementById('img-preview');
      prev.src = p.image;
      prev.style.display = 'block';
    } else {
      document.getElementById('img-preview').style.display = 'none';
    }
  } else {
    document.getElementById('modal-title').textContent = 'Nuevo producto';
    ['f-name','f-category','f-code','f-link','f-price','f-notes'].forEach(id => {
      const el = document.getElementById(id);
      if (el.tagName === 'SELECT') el.value = '';
      else el.value = '';
    });
    document.getElementById('f-qty').value = 1;
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('img-input').value = '';
  }
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  editingId = null;
  currentImageData = null;
}

function closeOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImageData = ev.target.result;
    const prev = document.getElementById('img-preview');
    prev.src = currentImageData;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('El nombre del producto es obligatorio.'); return; }

  const product = {
    id: editingId || Date.now().toString(),
    name,
    category: document.getElementById('f-category').value,
    code: document.getElementById('f-code').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    price: parseFloat(document.getElementById('f-price').value) || 0,
    qty: parseInt(document.getElementById('f-qty').value) || 1,
    notes: document.getElementById('f-notes').value.trim(),
    image: currentImageData || null,
    purchased: false,
    createdAt: new Date().toISOString()
  };

  if (editingId) {
    const existing = products.find(p => p.id === editingId);
    product.purchased = existing ? existing.purchased : false;
    product.createdAt = existing ? existing.createdAt : product.createdAt;
    products = products.map(p => p.id === editingId ? product : p);
  } else {
    products.unshift(product);
  }

  save();
  closeModal();
  render();
}

function editProduct(id) { openModal(id); }

function deleteProduct(id) {
  if (!confirm('¿Eliminar este producto de la lista?')) return;
  products = products.filter(p => p.id !== id);
  save();
  render();
}

function markPurchased(id) {
  products = products.map(p => p.id === id ? {...p, purchased: !p.purchased} : p);
  save();
  render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function searchProducts(q) {
  searchQuery = q;
  render();
}

// Drag & drop
const uploadArea = document.getElementById('upload-area');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--mocha)'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = 'var(--taupe)'; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = 'var(--taupe)';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const fakeEvent = { target: { files: [file] } };
    handleImage(fakeEvent);
  }
});

render();
</script>
</body>
</html>
