<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valente Studio · Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>💝 Valente Studio</h1>
      <div class="subtitle">Inventario de productos por comprar</div>
      <div class="tagline">Curated with love · Lista de deseos</div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="num" id="stat-total">0</span>
        <span class="lbl">Productos</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-amount">₡0</span>
        <span class="lbl">Total estimado</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-pending">0</span>
        <span class="lbl">Por comprar</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="autosave-bar">
    <div class="autosave-dot"></div>
    <span id="autosave-label">Guardado automático activo</span>
  </div>
  <div style="margin-bottom:18px;">
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
      <span id="storage-label" style="font-size:0.72rem;color:var(--text-light);"></span>
    </div>
    <div style="background:var(--sand);border-radius:100px;height:5px;overflow:hidden;">
      <div id="storage-bar-fill" style="height:100%;width:0%;background:var(--sage);border-radius:100px;transition:width 0.4s,background 0.4s;"></div>
    </div>
  </div>
  <div class="add-btn-wrap">
    <button class="btn-export" onclick="exportToExcel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      Exportar a Excel
    </button>
    <button class="btn-add" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar producto
    </button>
  </div>

  <div class="filters">
    <span class="filter-label">Filtrar:</span>
    <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Por comprar</button>
    <button class="filter-btn" onclick="setFilter('purchased', this)">Comprados</button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Buscar producto..." oninput="searchProducts(this.value)" id="search-input">
    </div>
  </div>

  <div id="grid" class="grid"></div>
</main>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nuevo producto</h2>
      <button class="btn-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Imagen del producto</label>
        <div class="img-upload-area" id="upload-area">
          <input type="file" accept="image/*" id="img-input" onchange="handleImage(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p><strong>Haz clic o arrastra</strong> una captura de pantalla</p>
          <p style="font-size:0.75rem;margin-top:4px;">JPG, PNG, WEBP</p>
          <img class="img-preview" id="img-preview" alt="Vista previa">
        </div>
      </div>

      <div class="form-group">
        <label>Nombre del producto *</label>
        <input type="text" id="f-name" placeholder="Ej: Silla ergonómica OfficePro">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="f-category">
          <option value="">Sin categoría</option>
          <option value="Baby Dreams">👶 Baby Dreams</option>
          <option value="Little Princess">🎀 Little Princess</option>
          <option value="Matcha Era">🍵 Matcha Era</option>
          <option value="Glow & Grow">✨ Glow &amp; Grow</option>
          <option value="Wealth Era">💰 Wealth Era</option>
          <option value="Mom Life">🧑‍💼 Mom Life</option>
          <option value="Wellness">🌿 Wellness</option>
          <option value="Wedding">💍 Wedding</option>
          <option value="Corporate">🏢 Corporate</option>
        </select>
      </div>

      <div class="form-group">
        <label>Código / SKU</label>
        <input type="text" id="f-code" placeholder="Ej: SKU-12345">
      </div>

      <div class="form-group">
        <label>Enlace / URL</label>
        <input type="url" id="f-link" placeholder="https://...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Precio unitario</label>
          <input type="number" id="f-price" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" id="f-qty" placeholder="1" min="1" value="1">
        </div>
      </div>

      <div class="form-group">
        <label>Notas / Descripción</label>
        <textarea id="f-notes" placeholder="Razón de compra, color, talla, etc."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveProduct()">Guardar producto</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
